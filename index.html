<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Bài Giảng Phát Triển Ứng Dụng IoT - Đầy Đủ Chương 1, 3, 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-heading: 'Outfit', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* THEME DARK (Mặc định) */
    [data-theme="dark"] {
      --bg-base: #07090e;
      --bg-surface: #0e131f;
      --bg-card: rgba(18, 26, 42, 0.75);
      --bg-card-hover: rgba(26, 37, 59, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(2, 132, 199, 0.6);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-gradient: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #10b981 100%);
      --accent-glow: rgba(2, 132, 199, 0.25);
      --tag-bg: rgba(2, 132, 199, 0.15);
      --tag-color: #38bdf8;
      --bilingual-bg: rgba(15, 23, 42, 0.6);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
      --modal-bg: rgba(4, 7, 14, 0.92);
    }

    /* THEME LIGHT */
    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: rgba(2, 132, 199, 0.6);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0369a1;
      --accent-hover: #0284c7;
      --accent-gradient: linear-gradient(135deg, #0369a1 0%, #0891b2 50%, #059669 100%);
      --accent-glow: rgba(3, 105, 161, 0.15);
      --tag-bg: #e0f2fe;
      --tag-color: #0369a1;
      --bilingual-bg: #f8fafc;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.1);
      --modal-bg: rgba(15, 23, 42, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.65;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* PROGRESS BAR */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--accent-gradient);
      width: 0%;
      z-index: 1000;
      transition: width 0.25s ease;
    }

    /* TOP HEADER */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 100;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon-wrap {
      width: 36px;
      height: 36px;
      background: var(--accent-gradient);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .brand-title span {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* CHAPTER NAVIGATION TABS */
    .chapter-tabs-nav {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      overflow-x: auto;
    }

    .chapter-tab-btn {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .chapter-tab-btn:hover {
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }

    .chapter-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .chapter-tab-badge {
      font-size: 0.68rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* BUTTONS */
    .btn {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
      user-select: none;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-icon {
      padding: 0.45rem;
      width: 34px;
      height: 34px;
      justify-content: center;
    }

    .btn-group {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .btn-group .btn {
      border: none;
      background: transparent;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
    }

    .btn-group .btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* MAIN APP LAYOUT */
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR */
    #sidebar {
      width: 330px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease;
      z-index: 40;
    }

    #sidebar.collapsed {
      transform: translateX(-100%);
      width: 0;
      border-right: none;
    }

    .sidebar-header {
      padding: 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.48rem 0.85rem 0.48rem 2.2rem;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.84rem;
      outline: none;
      transition: var(--transition);
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon-svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .section-filter-scroll {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .section-chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .section-chip.active, .section-chip:hover {
      background: var(--tag-bg);
      color: var(--tag-color);
      border-color: var(--tag-color);
    }

    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .slide-item {
      display: flex;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      align-items: center;
    }

    .slide-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border);
    }

    .slide-item.active {
      background: var(--tag-bg);
      border-color: var(--accent);
    }

    .slide-thumb-wrap {
      width: 60px;
      height: 42px;
      border-radius: 6px;
      overflow: hidden;
      background: #020617;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .slide-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-meta {
      flex: 1;
      min-width: 0;
    }

    .slide-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.15rem;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
    }

    .slide-sec-tag {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .slide-title-preview {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN VIEW CONTAINER */
    #main-content {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-base);
      position: relative;
    }

    /* 1. PRESENTATION VIEW */
    .view-presentation {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 1.25rem 1.5rem;
      gap: 1rem;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
    }

    .pres-stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 1.25rem;
      min-height: 0;
    }

    @media (max-width: 1024px) {
      .pres-stage {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
    }

    /* LECTURE TEXT CARD (LEFT) */
    .pres-text-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .pres-sec-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--tag-bg);
      color: var(--tag-color);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      align-self: flex-start;
      border: 1px solid rgba(2, 132, 199, 0.2);
    }

    .pres-title {
      font-family: var(--font-heading);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .pres-body {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      font-size: 0.98rem;
      color: var(--text-primary);
    }

    .pres-body h3 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 0.35rem;
    }

    .pres-body p {
      color: var(--text-primary);
      text-align: justify;
    }

    .pres-bullet-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      list-style: none;
    }

    .pres-bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .pres-bullet-item:hover {
      border-color: var(--border-focus);
      background: var(--bg-card-hover);
    }

    .bullet-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      margin-top: 0.5rem;
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .pres-note {
      font-style: italic;
      color: var(--text-secondary);
      background: rgba(148, 163, 184, 0.08);
      border-left: 3px solid var(--accent);
      padding: 0.55rem 0.85rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.86rem;
    }

    /* BILINGUAL PEEK CARD */
    .bilingual-card {
      margin-top: 0.5rem;
      background: var(--bilingual-bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: none;
    }

    .bilingual-card.show {
      display: block;
    }

    .bilingual-header {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }

    /* ORIGINAL SLIDE IMAGE CARD (RIGHT) */
    .pres-img-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }

    .pres-img-header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: var(--bg-card);
    }

    .pres-img-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      padding: 0.75rem;
      cursor: zoom-in;
      position: relative;
      overflow: hidden;
    }

    .pres-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .pres-img-container:hover img {
      transform: scale(1.02);
    }

    .zoom-hint {
      position: absolute;
      bottom: 0.85rem;
      right: 0.85rem;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 0.72rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* BOTTOM CONTROLS */
    .pres-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    .pres-counter {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .key-hints {
      display: flex;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .kbd {
      background: var(--bg-base);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    /* 2. DOCUMENT / READER VIEW */
    .view-document {
      display: none;
      padding: 2.5rem 1.5rem;
      max-width: 1080px;
      margin: 0 auto;
      gap: 2rem;
      flex-direction: column;
      width: 100%;
    }

    .doc-chapter-intro {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .doc-chapter-intro h2 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .doc-chapter-intro p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .doc-slide-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      scroll-margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .doc-slide-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-lg);
    }

    .doc-slide-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
    }

    .doc-slide-header h3 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .doc-slide-content {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .doc-text-content {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .doc-text-content p {
      margin-bottom: 0.4rem;
      text-align: justify;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .doc-text-content h4 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 0.4rem;
    }

    .doc-text-content .pres-bullet-item {
      margin-bottom: 0;
    }

    .doc-text-content .pres-note {
      margin-bottom: 0;
    }

    .doc-slide-img {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #020617;
      cursor: zoom-in;
    }

    .doc-slide-img img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .doc-slide-img:hover img {
      transform: scale(1.03);
    }

    .doc-slide-content-full {
      display: flex;
      justify-content: center;
      padding: 1.5rem;
    }

    .doc-slide-img-full {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* LIGHTBOX MODAL */
    #lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--modal-bg);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    #lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .lightbox-caption {
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -2.5rem;
      right: 0;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }

    /* ============ RESPONSIVE ============ */

    /* Tablet */
    @media (max-width: 1100px) {
      .pres-stage {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .doc-slide-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .chapter-tabs-nav {
        order: 3;
        width: 100%;
        margin-top: 0.5rem;
      }
      header {
        flex-wrap: wrap;
        padding: 0.65rem 1rem;
      }
      #sidebar {
        position: absolute;
        height: 100%;
        box-shadow: var(--shadow-lg);
      }
      .key-hints {
        display: none;
      }
      .brand-title span {
        display: none;
      }
    }

    /* Mobile */
    @media (max-width: 640px) {
      header {
        padding: 0.5rem 0.75rem;
        gap: 0.5rem;
      }

      .brand-title h1 {
        font-size: 0.88rem;
      }

      .brand-title span {
        display: none;
      }

      .brand-icon-wrap {
        width: 30px;
        height: 30px;
        border-radius: 7px;
      }

      .brand-icon-wrap svg {
        width: 16px;
        height: 16px;
      }

      .chapter-tabs-nav {
        order: 3;
        width: 100%;
        margin-top: 0.35rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .chapter-tabs-nav::-webkit-scrollbar {
        display: none;
      }

      .chapter-tab-btn {
        font-size: 0.72rem;
        padding: 0.35rem 0.65rem;

      .header-actions {
        gap: 0.3rem;
      }

      .btn-group {
        padding: 2px;
      }

      .btn-group .btn {
        font-size: 0.72rem;
        padding: 0.3rem 0.5rem;
        gap: 0.25rem;
      }

      .btn-group .btn svg {
        width: 12px;
        height: 12px;
      }

      #btn-bilingual-toggle {
        font-size: 0.72rem;
        padding: 0.35rem 0.5rem;
      }

      #btn-bilingual-toggle span {
        display: none;
      }

      .btn-icon {
        width: 30px;
        height: 30px;
        padding: 0.3rem;
      }

      /* SIDEBAR MOBILE */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 85vw;
        max-width: 320px;
        height: 100vh;
        z-index: 200;
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #sidebar.mobile-open {
        transform: translateX(0);
      }

      #sidebar.collapsed {
        transform: translateX(-100%);
        width: 85vw;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 190;
        backdrop-filter: blur(2px);
      }

      .sidebar-overlay.active {
        display: block;
      }

      .search-box input {
        font-size: 0.82rem;
      }

      .slide-thumb-wrap {
        width: 50px;
        height: 35px;
      }

      .slide-num {
        font-size: 0.68rem;
      }

      .slide-title-preview {
        font-size: 0.74rem;
      }

      /* MAIN CONTENT MOBILE */
      .view-presentation {
        padding: 0.75rem;
        gap: 0.75rem;
      }

      .pres-stage {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: 0.75rem;
      }

      .pres-text-card {
        padding: 1rem;
        border-radius: 12px;
        gap: 0.75rem;
      }

      .pres-title {
        font-size: 1.15rem;
        padding-bottom: 0.5rem;
      }

      .pres-body {
        font-size: 0.88rem;
        gap: 0.65rem;
      }

      .pres-body h3 {
        font-size: 1rem;
      }

      .pres-bullet-item {
        padding: 0.65rem 0.75rem;
        font-size: 0.86rem;
        border-radius: 8px;
        gap: 0.55rem;
      }

      .pres-note {
        font-size: 0.8rem;
        padding: 0.45rem 0.7rem;
      }

      .pres-sec-badge {
        font-size: 0.72rem;
        padding: 0.2rem 0.55rem;
      }

      .pres-img-card {
        border-radius: 12px;
      }

      .pres-img-header {
        font-size: 0.72rem;
        padding: 0.45rem 0.75rem;
      }

      .pres-img-container {
        padding: 0.5rem;
      }

      .zoom-hint {
        font-size: 0.65rem;
        padding: 0.2rem 0.45rem;
        bottom: 0.5rem;
        right: 0.5rem;
      }

      /* CONTROLS MOBILE */
      .pres-controls {
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
      }

      .pres-controls .btn {
        font-size: 0.75rem;
        padding: 0.35rem 0.55rem;
      }

      .pres-counter {
        font-size: 0.8rem;

      }

      .key-hints {
        display: none;

      /* DOCUMENT VIEW MOBILE */
      .view-document {
        padding: 1rem 0.75rem;

      }

      .doc-chapter-intro {
        padding: 1.25rem;
        border-radius: 12px;

      .doc-chapter-intro h2 {

      .doc-slide-content {

    /* Extra small phones */

      }

</head>
<body>
  <div id="progress-bar"></div>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <button id="btn-toggle-sidebar" class="btn btn-icon" title="Đóng/Mở thanh mục lục">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand-icon-wrap">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div class="brand-title">
        <h1>Phát Triển Ứng Dụng IoT</h1>
        <span>Cổng bài giảng & tài liệu song ngữ Tiếng Việt</span>
      </div>
    </div>

    <!-- CHAPTER TABS NAV -->
    <nav class="chapter-tabs-nav" id="chapter-tabs-nav">
      <!-- Sinh động qua JS -->
    </nav>

    <!-- HEADER ACTIONS -->
    <div class="header-actions">
      <!-- VIEW MODE SWITCHER -->
      <div class="btn-group">
        <button id="btn-mode-pres" class="btn active" title="Chế độ Trình chiếu Slide">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Slide
        </button>
        <button id="btn-mode-doc" class="btn" title="Chế độ Giáo trình cuộn đọc">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/></svg>
          Giáo trình
        </button>
      </div>

      <!-- BILINGUAL PEEK TOGGLE -->
      <button id="btn-bilingual-toggle" class="btn" title="Hiện văn bản Tiếng Anh đối chiếu">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m1 14l4-9 4 9m-6-3h4M2 17l6-6-6-6"/></svg>
        <span id="bilingual-btn-text">Song ngữ</span>
      </button>

      <!-- THEME TOGGLE -->
      <button id="btn-theme-toggle" class="btn btn-icon" title="Đổi giao diện Sáng / Tối">
        <svg id="theme-icon-dark" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="theme-icon-light" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>

      <!-- FULLSCREEN -->
      <button id="btn-fullscreen" class="btn btn-icon" title="Toàn màn hình (F)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- SIDEBAR OVERLAY (for mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- APP LAYOUT -->
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="search-box">
          <svg class="search-icon-svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Tìm kiếm trong chương này...">
        </div>
        <div class="section-filter-scroll" id="section-filter-scroll">
          <!-- Dynamic section chips -->
        </div>
      </div>
      <div class="slide-list" id="slide-list-container">
        <!-- Dynamic slide thumbnails -->
      </div>
    </aside>

    <!-- MAIN VIEW -->
    <main id="main-content">
      <!-- 1. PRESENTATION VIEW -->
      <div class="view-presentation" id="view-presentation">
        <div class="pres-stage">
          <!-- LEFT CARD -->
          <div class="pres-text-card">
            <div class="pres-sec-badge" id="pres-sec-badge">Chuyên đề</div>
            <h2 class="pres-title" id="pres-title">Tiêu đề slide</h2>
            <div class="pres-body" id="pres-body">
              <!-- Rendered translation -->
            </div>
            <!-- BILINGUAL PEEK -->
            <div class="bilingual-card" id="bilingual-card">
              <div class="bilingual-header">Nguyên bản tiếng Anh (Original)</div>
              <div id="bilingual-body"></div>
            </div>
          </div>

          <!-- RIGHT CARD -->
          <div class="pres-img-card">
            <div class="pres-img-header">
              <span>Sơ đồ & Hình ảnh nguyên bản (Slide <span id="pres-img-num">1</span>)</span>
              <span>Nhấp để phóng to</span>
            </div>
            <div class="pres-img-container" id="pres-img-container">
              <img id="pres-slide-img" src="" alt="Slide illustration">
              <div class="zoom-hint">
                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>
                Phóng to
              </div>
            </div>
          </div>
        </div>

        <!-- CONTROLS -->
        <div class="pres-controls">
          <button id="btn-prev-slide" class="btn" title="Slide trước (←)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
            Trước đó
          </button>

          <div class="pres-counter">
            <span id="pres-chapter-label" style="color:var(--text-secondary);font-size:0.85rem;"></span>
            <span>Slide</span>
            <span id="pres-current-idx" style="color:var(--accent);"></span>
            <span style="color:var(--text-muted);">/</span>
            <span id="pres-total-slides" style="color:var(--text-secondary);"></span>
          </div>

          <div class="key-hints">
            <span>Phím <span class="kbd">←</span> <span class="kbd">→</span> chuyển slide</span>
            <span>Phím <span class="kbd">F</span> toàn màn hình</span>
          </div>

          <button id="btn-next-slide" class="btn btn-primary" title="Slide tiếp theo (→ hoặc Space)">
            Tiếp theo
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- 2. DOCUMENT VIEW -->
      <div class="view-document" id="view-document">
        <!-- Rendered long document -->
      </div>
    </main>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox-modal">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close">&times;</button>
      <img id="lightbox-img" src="" alt="Zoomed diagram">
      <div class="lightbox-caption" id="lightbox-caption">Sơ đồ chi tiết</div>
    </div>
  </div>

  <!-- LOAD EMBEDDED CHAPTERS DATA -->
  <script src="data/chapters_data.js"></script>
  <script>
    // State
    let chaptersData = window.IOT_CHAPTERS_DATA || {};
    let activeChapterId = 'c1';
    let currentSlideIndex = 0;
    let currentViewMode = 'doc'; // 'pres' | 'doc' - default to giáo trình
    let currentSectionFilter = 'all';
    let searchQuery = '';
    let showBilingual = false;

    // DOM References
    const chapterTabsNav = document.getElementById('chapter-tabs-nav');
    const sidebar = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
    const searchInput = document.getElementById('search-input');
    const sectionFilterScroll = document.getElementById('section-filter-scroll');
    const slideListContainer = document.getElementById('slide-list-container');
    const progressBar = document.getElementById('progress-bar');

    // Controls
    const btnModePres = document.getElementById('btn-mode-pres');
    const btnModeDoc = document.getElementById('btn-mode-doc');
    const viewPres = document.getElementById('view-presentation');
    const viewDoc = document.getElementById('view-document');
    const btnBilingualToggle = document.getElementById('btn-bilingual-toggle');
    const bilingualCard = document.getElementById('bilingual-card');
    const bilingualBody = document.getElementById('bilingual-body');
    const btnThemeToggle = document.getElementById('btn-theme-toggle');
    const themeIconDark = document.getElementById('theme-icon-dark');
    const themeIconLight = document.getElementById('theme-icon-light');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    // Pres elements
    const presSecBadge = document.getElementById('pres-sec-badge');
    const presTitle = document.getElementById('pres-title');
    const presBody = document.getElementById('pres-body');
    const presSlideImg = document.getElementById('pres-slide-img');
    const presImgContainer = document.getElementById('pres-img-container');
    const presImgNum = document.getElementById('pres-img-num');
    const presChapterLabel = document.getElementById('pres-chapter-label');
    const presCurrentIdx = document.getElementById('pres-current-idx');
    const presTotalSlides = document.getElementById('pres-total-slides');
    const btnPrevSlide = document.getElementById('btn-prev-slide');
    const btnNextSlide = document.getElementById('btn-next-slide');

    // Lightbox
    const lightboxModal = document.getElementById('lightbox-modal');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close');

    // INITIALIZATION
    async function init() {
      // Fallback nếu chapters_data.js chưa load
      if (!chaptersData || Object.keys(chaptersData).length === 0) {
        try {
          const resp = await fetch('data/all_chapters.json');
          chaptersData = await resp.json();
        } catch (e) {
          console.error("Không tải được dữ liệu chapters:", e);
        }
      }

      // Set default theme to light
      document.documentElement.setAttribute('data-theme', 'light');
      themeIconDark.style.display = 'none';
      themeIconLight.style.display = 'block';

      // Set default view to doc (giáo trình)
      currentViewMode = 'doc';
      btnModeDoc.classList.add('active');
      btnModePres.classList.remove('active');
      viewPres.style.display = 'none';
      viewDoc.style.display = 'flex';

      // Default collapse sidebar on mobile
      if (window.innerWidth <= 640) {
        sidebar.classList.add('collapsed');
      }

      renderChapterTabs();
      switchChapter('c1');
      setupEventListeners();
    }

    // RENDER CHAPTER TABS
    function renderChapterTabs() {
      chapterTabsNav.innerHTML = '';
      const order = ['c1', 'c3', 'c4', 'c4_updated'];
      order.forEach(id => {
        if (!chaptersData[id]) return;
        const chap = chaptersData[id].meta;
        const btn = document.createElement('button');
        btn.className = `chapter-tab-btn ${id === activeChapterId ? 'active' : ''}`;
        btn.dataset.id = id;
        btn.innerHTML = `
          <span>${chap.badge}</span>
          <span class="chapter-tab-badge">${chap.total_slides}</span>
        `;
        btn.title = chap.name;
        btn.addEventListener('click', () => switchChapter(id));
        chapterTabsNav.appendChild(btn);
      });
    }

    // SWITCH ACTIVE CHAPTER
    function switchChapter(chapId) {
      if (!chaptersData[chapId]) return;
      activeChapterId = chapId;
      currentSlideIndex = 0;
      currentSectionFilter = 'all';
      searchQuery = '';
      if (searchInput) searchInput.value = '';

      // Update tabs UI
      document.querySelectorAll('.chapter-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === chapId);
      });

      renderSectionFilters();
      renderSidebarList();
      renderDocumentView();
      goToSlide(0);
    }

    // RENDER SECTION FILTERS CHIPS
    function renderSectionFilters() {
      sectionFilterScroll.innerHTML = '';
      const slides = chaptersData[activeChapterId].slides;
      const sections = new Set();
      slides.forEach(s => {
        if (s.section && s.section.trim()) {
          sections.add(s.section.trim());
        }
      });

      // 'Tất cả' chip
      const allChip = document.createElement('button');
      allChip.className = `section-chip ${currentSectionFilter === 'all' ? 'active' : ''}`;
      allChip.textContent = `Tất cả (${slides.length})`;
      allChip.dataset.filter = 'all';
      allChip.addEventListener('click', () => {
        currentSectionFilter = 'all';
        updateFilterChips();
        renderSidebarList();
      });
      sectionFilterScroll.appendChild(allChip);

      // Add sections
      sections.forEach(sec => {
        const chip = document.createElement('button');
        chip.className = `section-chip ${currentSectionFilter === sec ? 'active' : ''}`;
        // Shorten long section titles for chips
        let shortSec = sec.length > 25 ? sec.slice(0, 25) + '…' : sec;
        chip.textContent = shortSec;
        chip.title = sec;
        chip.dataset.filter = sec;
        chip.addEventListener('click', () => {
          currentSectionFilter = sec;
          updateFilterChips();
          renderSidebarList();
        });
        sectionFilterScroll.appendChild(chip);
      });
    }

    function updateFilterChips() {
      document.querySelectorAll('.section-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.filter === currentSectionFilter);
      });
    }

    // RENDER SIDEBAR SLIDE LIST
    function renderSidebarList() {
      slideListContainer.innerHTML = '';
      const slides = chaptersData[activeChapterId].slides;

      const filtered = slides.filter(s => {
        const matchSec = currentSectionFilter === 'all' || s.section === currentSectionFilter;
        const q = searchQuery.toLowerCase();
        const matchQ = !searchQuery || 
          s.title.toLowerCase().includes(q) || 
          s.raw_text_vi.toLowerCase().includes(q) ||
          s.raw_text_en.toLowerCase().includes(q) ||
          s.num.toString() === q;
        return matchSec && matchQ;
      });

      if (filtered.length === 0) {
        slideListContainer.innerHTML = `<div style="padding:1.5rem;text-align:center;color:var(--text-muted);font-size:0.85rem;">Không tìm thấy slide phù hợp</div>`;
        return;
      }

      filtered.forEach(s => {
        const realIdx = slides.findIndex(item => item.num === s.num);
        const item = document.createElement('div');
        item.className = `slide-item ${realIdx === currentSlideIndex ? 'active' : ''}`;
        item.dataset.index = realIdx;
        item.innerHTML = `
          <div class="slide-thumb-wrap">
            <img src="${s.image}" alt="Slide ${s.num}" loading="lazy">
          </div>
          <div class="slide-meta">
            <div class="slide-badge-row">
              <span class="slide-num">Slide ${s.num}</span>
              <span class="slide-sec-tag">${s.section || 'Nội dung'}</span>
            </div>
            <div class="slide-title-preview" title="${s.title}">${s.title}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          goToSlide(realIdx);
          // Close sidebar on mobile
          if (window.innerWidth <= 640) {
            sidebar.classList.remove('mobile-open');
            const overlay = document.getElementById('sidebar-overlay');
            if (overlay) overlay.classList.remove('active');
          }
        });
        slideListContainer.appendChild(item);
      });
    }

    // GO TO SLIDE
    function goToSlide(index) {
      const slides = chaptersData[activeChapterId].slides;
      if (index < 0 || index >= slides.length) return;
      currentSlideIndex = index;
      const s = slides[index];

      // Update progress bar
      const pct = ((index + 1) / slides.length) * 100;
      progressBar.style.width = `${pct}%`;

      // Update counters
      presChapterLabel.textContent = chaptersData[activeChapterId].meta.badge + ' •';
      presCurrentIdx.textContent = s.num;
      presTotalSlides.textContent = slides[slides.length - 1].num;
      presImgNum.textContent = s.num;

      // Update text card
      presSecBadge.textContent = s.section || chaptersData[activeChapterId].meta.name;
      presTitle.textContent = s.title;

      presBody.innerHTML = '';
      let bulletList = null;

      if (!s.elements || s.elements.length === 0) {
        presBody.innerHTML = `
          <div class="pres-note" style="background:var(--tag-bg);border-left:3px solid var(--accent);color:var(--text-secondary);padding:1rem 1.25rem;border-radius:10px;line-height:1.6;">
            <div style="font-weight:600;color:var(--text-primary);margin-bottom:0.35rem;display:flex;align-items:center;gap:0.5rem;">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              Nội dung gốc bằng tiếng Việt
            </div>
            Slide này trong tài liệu gốc đã có sẵn nội dung tiếng Việt nên không cần bản dịch. Mời bạn theo dõi trực tiếp nội dung trên hình ảnh bài giảng bên phải (có thể nhấp vào hình để phóng to).
          </div>
        `;
      } else {
        s.elements.forEach(elem => {
          // Skip empty elements
          if (!elem.vi || elem.vi.trim() === '') return;
          
          if (elem.type === 'bullet') {
            if (!bulletList) {
              bulletList = document.createElement('div');
              bulletList.className = 'pres-bullet-list';
              presBody.appendChild(bulletList);
            }
            const item = document.createElement('div');
            item.className = 'pres-bullet-item';
            item.innerHTML = `<span class="bullet-dot"></span><span>${elem.vi}</span>`;
            bulletList.appendChild(item);
          } else {
            if (elem.type === 'title') {
              if (elem.vi.length > 55 || elem.vi.endsWith('.') || elem.vi.endsWith(':') || elem.vi.startsWith('•') || elem.vi.startsWith('-')) {
                if (!bulletList) {
                  bulletList = document.createElement('div');
                  bulletList.className = 'pres-bullet-list';
                  presBody.appendChild(bulletList);
                }
                const item = document.createElement('div');
                item.className = 'pres-bullet-item';
                item.innerHTML = `<span class="bullet-dot"></span><span>${elem.vi}</span>`;
                bulletList.appendChild(item);
              } else {
                bulletList = null;
                const h = document.createElement('h3');
                h.textContent = elem.vi;
                presBody.appendChild(h);
              }
            } else if (elem.type === 'note') {
              bulletList = null;
              const n = document.createElement('div');
              n.className = 'pres-note';
              n.textContent = elem.vi;
              presBody.appendChild(n);
            } else {
              bulletList = null;
              const p = document.createElement('p');
              p.textContent = elem.vi;
              presBody.appendChild(p);
            }
          }
        });
      }

      // Update bilingual original English text
      bilingualBody.innerHTML = '';
      let hasBilingual = false;
      if (s.elements && s.elements.length > 0) {
        s.elements.forEach(elem => {
          if (elem.en && elem.en !== elem.vi) {
            hasBilingual = true;
            const div = document.createElement('div');
            div.style.marginBottom = '0.4rem';
            div.textContent = (elem.type === 'bullet' ? '• ' : '') + elem.en;
            bilingualBody.appendChild(div);
          }
        });
      }
      if (btnBilingualToggle) {
        btnBilingualToggle.style.display = hasBilingual ? 'inline-flex' : 'none';
      }
      if (!hasBilingual) {
        bilingualCard.classList.remove('show');
      } else if (showBilingual) {
        bilingualCard.classList.add('show');
      }

      // Update image
      presSlideImg.src = s.image;

      // Update active in sidebar
      document.querySelectorAll('.slide-item').forEach(it => {
        if (parseInt(it.dataset.index) === index) {
          it.classList.add('active');
          it.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          it.classList.remove('active');
        }
      });

      // If in doc mode, scroll to card
      if (currentViewMode === 'doc') {
        const card = document.getElementById(`doc-slide-${activeChapterId}-${s.num}`);
        if (card) card.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // RENDER DOCUMENT VIEW
    function renderDocumentView() {
      viewDoc.innerHTML = '';
      const chapMeta = chaptersData[activeChapterId].meta;
      const slides = chaptersData[activeChapterId].slides;

      // Intro card
      const intro = document.createElement('div');
      intro.className = 'doc-chapter-intro';
      intro.innerHTML = `
        <h2>${chapMeta.name}</h2>
        <p>${chapMeta.desc}</p>
        <div style="margin-top:0.75rem;font-size:0.85rem;color:var(--text-muted);">
          Tài liệu bài giảng chính thức • Tổng cộng ${slides.length} slide bài học
        </div>
      `;
      viewDoc.appendChild(intro);

      slides.forEach(s => {
        const card = document.createElement('div');
        card.className = 'doc-slide-card';
        card.id = `doc-slide-${activeChapterId}-${s.num}`;

        let textHtml = '';
        let hasBulletGroup = false;
        if (s.elements && s.elements.length > 0) {
          s.elements.forEach(elem => {
            // Skip empty elements
            if (!elem.vi || elem.vi.trim() === '') return;
            
            if (elem.type === 'bullet') {
              textHtml += `<div class="pres-bullet-item"><span class="bullet-dot"></span><span>${elem.vi}</span></div>`;
              hasBulletGroup = true;
            } else if (elem.type === 'title') {
              if (elem.vi.length > 55 || elem.vi.endsWith('.') || elem.vi.endsWith(':') || elem.vi.startsWith('•') || elem.vi.startsWith('-')) {
                textHtml += `<div class="pres-bullet-item"><span class="bullet-dot"></span><span>${elem.vi}</span></div>`;
                hasBulletGroup = true;
              } else {
                textHtml += `<h4>${elem.vi}</h4>`;
                hasBulletGroup = false;
              }
            } else if (elem.type === 'note') {
              textHtml += `<div class="pres-note">${elem.vi}</div>`;
              hasBulletGroup = false;
            } else {
              textHtml += `<p>${elem.vi}</p>`;
              hasBulletGroup = false;
            }
          });
        }

        if (!textHtml.trim()) {
          // Slide has no translation needed (e.g. original slide is already in Vietnamese)
          card.innerHTML = `
            <div class="doc-slide-header">
              <div>
                <span class="pres-sec-badge">${s.section || chapMeta.name}</span>
                <h3 style="margin-top:0.35rem;">Slide ${s.num}: ${s.title}</h3>
                <div style="font-size:0.85rem;color:var(--accent);margin-top:0.3rem;display:flex;align-items:center;gap:0.35rem;">
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                  Nội dung gốc bằng tiếng Việt (xem trực tiếp trên slide)
                </div>
              </div>
              <button class="btn btn-icon" onclick="openLightbox('${s.image}', 'Slide ${s.num}: ${s.title}')" title="Phóng to sơ đồ">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
            </div>
            <div class="doc-slide-content doc-slide-content-full">
              <div class="doc-slide-img doc-slide-img-full" onclick="openLightbox('${s.image}', 'Slide ${s.num}: ${s.title}')">
                <img src="${s.image}" alt="Slide ${s.num}" loading="lazy">
              </div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="doc-slide-header">
              <div>
                <span class="pres-sec-badge">${s.section || chapMeta.name}</span>
                <h3 style="margin-top:0.35rem;">Slide ${s.num}: ${s.title}</h3>
              </div>
              <button class="btn btn-icon" onclick="openLightbox('${s.image}', 'Slide ${s.num}: ${s.title}')" title="Phóng to sơ đồ">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
            </div>
            <div class="doc-slide-content">
              <div class="doc-text-content">${textHtml}</div>
              <div class="doc-slide-img" onclick="openLightbox('${s.image}', 'Slide ${s.num}: ${s.title}')">
                <img src="${s.image}" alt="Slide ${s.num}" loading="lazy">
              </div>
            </div>
          `;
        }
        viewDoc.appendChild(card);
      });
    }

    // LIGHTBOX
    function openLightbox(imgSrc, caption) {
      lightboxImg.src = imgSrc;
      lightboxCaption.textContent = caption;
      lightboxModal.classList.add('active');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
    }

    // EVENT LISTENERS
    function setupEventListeners() {
      // Prev / Next
      btnPrevSlide.addEventListener('click', () => goToSlide(currentSlideIndex - 1));
      btnNextSlide.addEventListener('click', () => goToSlide(currentSlideIndex + 1));

      // Image click zoom
      presImgContainer.addEventListener('click', () => {
        const s = chaptersData[activeChapterId].slides[currentSlideIndex];
        openLightbox(s.image, `Slide ${s.num}: ${s.title}`);
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal) closeLightbox();
      });

      // Sidebar toggle with mobile overlay
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      btnToggleSidebar.addEventListener('click', () => {
        if (window.innerWidth <= 640) {
          // Mobile: toggle mobile-open class
          sidebar.classList.toggle('mobile-open');
          if (sidebarOverlay) {
            sidebarOverlay.classList.toggle('active', sidebar.classList.contains('mobile-open'));
          }
        } else {
          // Desktop: toggle collapsed class
          sidebar.classList.toggle('collapsed');
        }
      });
      if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', () => {
          sidebar.classList.remove('mobile-open');
          sidebarOverlay.classList.remove('active');
        });
      }

      // View mode switcher
      btnModePres.addEventListener('click', () => {
        currentViewMode = 'pres';
        btnModePres.classList.add('active');
        btnModeDoc.classList.remove('active');
        viewPres.style.display = 'flex';
        viewDoc.style.display = 'none';
        goToSlide(currentSlideIndex);
      });

      btnModeDoc.addEventListener('click', () => {
        currentViewMode = 'doc';
        btnModeDoc.classList.add('active');
        btnModePres.classList.remove('active');
        viewPres.style.display = 'none';
        viewDoc.style.display = 'flex';
        const s = chaptersData[activeChapterId].slides[currentSlideIndex];
        const target = document.getElementById(`doc-slide-${activeChapterId}-${s.num}`);
        if (target) target.scrollIntoView();
      });

      // Close sidebar when clicking slide on mobile
      window.addEventListener('resize', () => {
        if (window.innerWidth > 640) {
          if (sidebarOverlay) sidebarOverlay.classList.remove('active');
        }
      });

      // Bilingual peek toggle
      btnBilingualToggle.addEventListener('click', () => {
        showBilingual = !showBilingual;
        bilingualCard.classList.toggle('show', showBilingual);
        btnBilingualToggle.classList.toggle('active', showBilingual);
      });

      // Dark / Light Theme
      btnThemeToggle.addEventListener('click', () => {
        const curr = document.documentElement.getAttribute('data-theme');
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        themeIconDark.style.display = next === 'dark' ? 'block' : 'none';
        themeIconLight.style.display = next === 'light' ? 'block' : 'none';
      });

      // Fullscreen
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => alert(err.message));
        } else {
          document.exitFullscreen();
        }
      });

      // Search
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderSidebarList();
      });

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          goToSlide(currentSlideIndex + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          goToSlide(currentSlideIndex - 1);
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          const slides = chaptersData[activeChapterId].slides;
          goToSlide(slides.length - 1);
        } else if (e.key.toLowerCase() === 'f') {
          btnFullscreen.click();
        } else if (e.key === 'Escape') {
          closeLightbox();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
